name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scientific_growth_log_ci?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/scientific_growth_log_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scientific_growth_log_ci?sslmode=disable
      BETTER_AUTH_SECRET: github-actions-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scientific_growth_log_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scientific_growth_log_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Run deployment tests
        run: pnpm test:deploy

      - name: Build
        run: pnpm build
